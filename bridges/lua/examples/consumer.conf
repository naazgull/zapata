{
    "identity": {
        "id": "3ac03a62-4114-4f12-b85c-304b3bac2dd1",
        "name": "example-lua-consumer"
    },
    "log": { "level": 6, "format": 1 },
    "load": [
        { "name": "builtin:tcp" },
        { "name": "builtin:upnp" },
        { "name": "builtin:rest" },
        { "name": "builtin:lua" }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 1048576
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 0
        }
    },
    "upnp": { "bind": "239.192.1.2", "port": 7979 },
    "transport": {
        "default": "tcp",
        "limits": {
            "max_workers": 16
        }
    },
    "rest": {
        "prefix" : "/api/1.0"
    },
    "lua": {
        "modules": [
            { "module": "example_lua_consumer", "file": "./consumer.lua" }
        ],
        "exec": [
            {
                "module": "example_lua_consumer",
                "function": "consume",
                "args": []
            }
        ]
    }
}
