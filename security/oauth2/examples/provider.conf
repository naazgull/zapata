{
    "identity": {
        "id": "a4a444e4-a6e0-11f0-99fa-ff740730cd76",
        "name": "example-oauth2-provider"
    },
    "log": { "level": 7, "format": 1 },
    "load": [
        { "name": "builtin:http" },
        { "name": "builtin:tcp" },
        { "name": "builtin:upnp" },
        { "name": "builtin:rest" },
        { "name": "builtin:oauth2" },
        { "name": "example-oauth2-provider", "source": "libzapata-example-oauth2-provider.so", "requires": [ "builtin:rest", "builtin:oauth2" ] }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 0
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 4
        }
    },
    "oauth2": {
        "url": {
            "authorize": "/oauth2/authorize",
            "token": "/oauth2/token",
            "refresh": "/oauth2/refresh",
            "validate": "/oauth2/validate",
            "device_authorization": "/oauth2/device-authorization",
            "approve": "/oauth2/approve"
        }
    },
    "http": { "bind": "0.0.0.0", "port": 8080 },
    "upnp": { "bind": "239.192.1.2", "port": 7979 },
    "transport": {
        "default": "http",
        "limits": {
            "max_workers": 16
        }
    },
    "rest": {
        "prefix" : "/api/1.0"
    }
}
