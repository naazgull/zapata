{
    "identity": {
        "id": "a4a444e4-a6e0-11f0-99fa-ff740730cd76",
        "name": "rest-server"
    },
    "log": { "level": 9, "format": 1 },
    "load": [
        { "name": "builtin:http" },
        { "name": "builtin:tcp" },
        { "name": "builtin:upnp" },
        { "name": "builtin:rest" },
        { "name": "rest-server", "source": "libzapata-rest-example.so", "requires": [ "builtin:rest" ] }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 1048576
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 4
        }
    },
    "tcp": { "bind": "${any}", "port": 8081 },
    "http": { "bind": "${any}", "port": 8080 },
    "upnp": { "bind": "239.192.1.2", "port": 7979 },
    "transport": {
        "default": "tcp",
        "limits": {
            "max_workers": 16
        }
    },
    "rest": {
        "prefix" : "/api/1.0"
    }
}
