name: C++ CI

on: 
  push:
    branches-ignore:
      - 'working_on'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies (APT)
      run: sudo apt -y install libsystemd-dev libcrypto++-dev libssl-dev libmagic-dev uuid-dev g++ cmake liblmdb-dev libsqlite3-dev lua5.4 liblua5.4-dev libmysqlclient-dev re2c bison swi-prolog postgresql libmongoclient-dev
    - name: Configure
      run: mkdir build && cd build && cmake .. -DCMAKE_BUILD_TYPE=release -DCMAKE_INSTALL_PREFIX=/usr/local/zapata
    - name: Build
      run: cmake --build build
