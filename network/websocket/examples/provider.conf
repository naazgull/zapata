{
    "identity": {
        "id": "a4a444e4-a6e0-11f0-99fa-ff740730cd76",
        "name": "example-ws-provider"
    },
    "log": { "level": 9, "format": 1 },
    "load": [
        { "name": "builtin:http" },
        { "name": "builtin:ws" },
        { "name": "builtin:rest" },
        { "name": "ws-example", "source": "libzapata-example-ws-provider.so", "requires": [ "builtin:rest" ] }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 1048576
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 4
        }
    },
    "http": { "bind": "0.0.0.0", "port": 8080 },
    "transport": {
        "default": "http",
        "limits": {
            "max_workers": 16
        }
    }
}
