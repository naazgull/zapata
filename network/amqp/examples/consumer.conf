{
    "identity": {
        "id": "d4ba2e4c-5e27-4684-b143-bd12470c901c",
        "name": "example-amqp-consumer"
    },
    "log": { "level": 7, "format": 1 },
    "load": [
        { "name": "builtin:amqp" },
        { "name": "builtin:upnp" },
        { "name": "builtin:rest" },
        { "name": "amqp-consumer", "source": "libzapata-example-amqp-consumer.so", "requires": [ "builtin:rest" ] }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 0
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 0
        }
    },
    "amqp": {
        "address": "127.0.0.1",
        "port": 5672,
        "subscribe": [ "/queues/jobs" ]
    },
    "upnp": { "bind": "239.192.1.2", "port": 7979 },
    "transport": {
        "default": "amqp",
        "limits": {
            "max_workers": 16
        }
    },
    "rest": {
        "prefix" : "/api/1.0"
    }
}
