{
    "identity": {
        "id": "a4a444e4-a6e0-11f0-99fa-ff740730cd76",
        "name": "example-rest-provider"
    },
    "log": { "level": 6, "format": 1 },
    "load": [
        { "name": "builtin:http" },
        { "name": "builtin:tcp" },
        { "name": "builtin:upnp" },
        { "name": "builtin:rest" },
        { "name": "rest-provider", "source": "libzapata-example-rest-provider.so", "requires": [ "builtin:rest" ] }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 0
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 4
        }
    },
    "tcp": { "bind": "0.0.0.0", "port": 8081 },
    "http": { "bind": "0.0.0.0", "port": 8080 },
    "upnp": { "bind": "239.192.1.2", "port": 7979 },
    "transport": {
        "default": "tcp",
        "limits": {
            "max_workers": 16
        }
    },
    "rest": {
        "prefix" : "/api/1.0"
    }
}
