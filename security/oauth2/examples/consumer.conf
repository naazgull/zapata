{
    "identity": {
        "id": "3ca77f4d-4e6c-44ff-b151-3d86c0a9f495",
        "name": "example-oauth2-consumer"
    },
    "log": { "level": 7, "format": 1 },
    "load": [
        { "name": "builtin:http" },
        { "name": "builtin:tcp" },
        { "name": "builtin:upnp" },
        { "name": "builtin:rest" },
        { "name": "example-oauth2-consumer", "source": "libzapata-example-oauth2-consumer.so", "requires": [ "builtin:rest" ] }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 0
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 0
        }
    },
    "oauth2": {
        "url": {
            "authorize": "/oauth2/authorize",
            "token": "/oauth2/token",
            "refresh": "/oauth2/refresh",
            "validate": "/oauth2/validate",
            "device_authorization": "/oauth2/device-authorization",
            "approve": "/oauth2/approve"
        }
    },
    "upnp": { "bind": "239.192.1.2", "port": 7979 },
    "transport": {
        "default": "tcp",
        "limits": {
            "max_workers": 16
        }
    },
    "rest": {
        "prefix" : "/api/1.0"
    }
}
