{
    "identity": {
        "id": "3ac03a62-4114-4f12-b85c-304b3bac2dd1",
        "name": "example-prolog-consumer"
    },
    "log": { "level": 6, "format": 1 },
    "load": [
        { "name": "builtin:tcp" },
        { "name": "builtin:upnp" },
        { "name": "builtin:rest" },
        { "name": "builtin:prolog" }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 0
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 0
        }
    },
    "upnp": { "bind": "239.192.1.2", "port": 7979 },
    "transport": {
        "default": "tcp",
        "limits": {
            "max_workers": 16
        }
    },
    "rest": {
        "prefix" : "/api/1.0"
    },
    "prolog": {
        "modules": [
            { "module": "example_prolog_consumer", "file": "./consumer.pl" }
        ],
        "exec": [
            "call(consume)"
        ]
    }
}
