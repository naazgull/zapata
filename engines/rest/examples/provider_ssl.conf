{
    "identity": {
        "id": "c073c148-6ea1-453b-8c34-377df94e578a",
        "name": "example-rest-provider-ssl"
    },
    "log": { "level": 7, "format": 1 },
    "load": [
        { "name": "builtin:http" },
        { "name": "builtin:tcp" },
        { "name": "builtin:upnp" },
        { "name": "builtin:rest" },
        { "name": "rest-provider", "source": "libzapata-example-rest-provider.so", "requires": [ "builtin:rest" ] }
    ],
    "resources": {
        "limits": {
            "max_heap_allocation": 0
        }
    },
    "dispatcher": {
        "limits": {
            "max_workers": 4
        }
    },
    "tcp": { "bind": "0.0.0.0", "port": 8081, "options": [ "ssl" ] },
    "http": { "bind": "0.0.0.0", "port": 8080, "options": [ "ssl" ] },
    "upnp": { "bind": "239.192.1.2", "port": 7979 },
    "transport": {
        "default": "http",
        "limits": {
            "max_workers": 16
        },
        "ssl": {
            "cert_file": "zapata.localhost.crt",
            "key_file": "zapata.localhost.key"
        }
    },
    "rest": {
        "prefix" : "/api/1.0"
    }
}
